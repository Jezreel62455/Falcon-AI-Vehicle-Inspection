<div class="submitted-page">

  <div class="success-card">

    <div class="icon">
      ✓
    </div>

    <h1>
      Inspection Submitted Successfully
    </h1>

    <p>
      Thank you. Your vehicle inspection has been received
      and is now being processed.
    </p>

    <div class="info-box">

      <h3>
        What happens next?
      </h3>

      <ul>
        <li>
          Our system will review your submitted inspection.
        </li>

        <li>
          Images and vehicle details will be analysed.
        </li>

        <li>
          Your insurer will receive the inspection results.
        </li>
      </ul>

    </div>


    <div class="actions">

      <button
        class="primary"
        (click)="viewStatus()">
        View Inspection Status
      </button>


      <button
        class="secondary"
        (click)="goHome()">
        Return Home
      </button>

    </div>

  </div>

</div>
